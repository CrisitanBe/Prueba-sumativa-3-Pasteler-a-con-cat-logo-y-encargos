{% extends "base.html" %}
{% block contenido %}
<h1>Nuestros productos</h1>

<form method="get">
    <input name="q" value="{{ request.GET.q }}">
    <select name="linea">
        <option value="">Todas</option>
        {% for l in lineas %}
            <option value="{{ l.id }}">{{ l.nombre }}</option>
        {% endfor %}
    </select>
    <button>Buscar</button>
</form>

<ul class="catalogo">
{% for p in productos %}
    <li>
        <img src="{{ p.foto_url }}" alt="{{ p.nombre }}" height="120">
        <strong>{{ p.nombre }}</strong>
        <span>{{ p.linea.nombre }}</span>
        <strong>{{ p.precio_clp }}</strong>
        {% if p.agotado %}<em>Agotado por hoy</em>{% endif %}
    </li>
{% empty %}
    <li>Todavía no hay productos cargados.</li>
{% endfor %}
</ul>
{% endblock %}
